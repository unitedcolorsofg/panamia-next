name: Playwright Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

# The test database is one shared Supabase project, and the job below resets
# it before every run: DROP SCHEMA public CASCADE, then replay every migration
# with psql. Two runs overlapping therefore race the same database. One drops
# the schema out from under the other's migration replay, and the loser dies
# partway through with errors like `type "event_visibility" already exists` --
# a failure that looks like a broken migration but is really just a collision.
#
# This is deliberately a fixed, repo-wide group rather than one keyed on the
# ref. The runs that actually collide are usually on *different* refs: a push
# to main and a pull request that landed seconds apart, for instance. Grouping
# per ref, which is the common default, would not separate those at all.
#
# cancel-in-progress stays false because the goal is to serialise, not to
# discard. Killing a run midway through the migration replay would leave the
# shared database half-migrated, which is the exact state this is here to
# avoid.
#
# What this does NOT do is queue, and an earlier version of this comment
# claimed it did. GitHub holds at most one running plus one *pending* run per
# concurrency group. A third run does not join a queue -- it EVICTS the pending
# one. cancel-in-progress: false protects the run that is already executing; it
# offers nothing at all to the run that is waiting.
#
# So the cost is not wall-clock, it is coverage, and it is silent. An evicted
# run completes with conclusion `cancelled` and an empty jobs list, which means
# it publishes no check-run whatsoever -- `gh pr checks` can report clean having
# executed zero tests. Measured across the 300 most recent runs of this workflow
# (2026-08-07 to 2026-10-05): 42 cancelled, 41 of those with zero jobs, and 15
# of those 41 on main. That is 13.7% of all runs testing nothing, and main
# landing unverified 15 times.
#
# Per-run schemas on this same database do not fix it. The 15-connection session
# pooler is a fixed supply and the number of concurrent runs is unbounded, so no
# per-run connection budget is safe; and lib/server/directory.ts pins
# search_path to 'public, extensions' per transaction, which would override any
# per-run routing and silently read the wrong schema.
#
# The fix is to stop sharing one database. See .github/workflows/db-tests.yml,
# which runs the data-layer suite against a throwaway Postgres service container
# and therefore needs no concurrency group at all. When the Playwright phase
# moves there too, this block and the DROP SCHEMA below go away together. They
# must not be removed separately: dropping a shared schema without serialisation
# is precisely the disaster this group exists to prevent.
concurrency:
  group: playwright-shared-db
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs before anything expensive: this is cheap, needs no dependencies,
      # and catches the class of migration defect that CI otherwise cannot see.
      # The migration replay below applies drizzle/[0-9]*.sql by filesystem
      # glob, so it happily runs a migration that has no _journal.json entry --
      # while production, which goes through drizzle-kit migrate, silently
      # skips that same file. CI therefore passes and production ships without
      # the tables. --strict makes missing tooling an error rather than a
      # skipped check, so this cannot quietly become a no-op.
      - name: Validate migrations
        run: bash scripts/validate-migrations.sh --strict

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Reset the test DB to a clean slate before each run so tests never
      # inherit state from a previous run. POSTGRES_DIRECT_URL must point to a
      # dedicated Supabase test project — never the production project.
      #
      # We bootstrap the `drizzle.__drizzle_migrations` table manually so
      # migration 0015 (which enables RLS on it) has something to target.
      # In production, drizzle-kit migrate creates this table on first run;
      # in CI we apply migrations via raw psql (see "Apply migrations" step
      # below for why), so we must seed it ourselves.
      #
      # Why psql instead of drizzle-kit migrate in CI:
      # GitHub-hosted runners are IPv4-only, but Supabase's direct DB host
      # (db.<ref>.supabase.co) is IPv6-only since early 2024. That forces us
      # to use the session pooler (aws-X.pooler.supabase.com:5432) from CI.
      # drizzle-kit's postgres.js client hangs indefinitely against the
      # session pooler — psql does not. Prod (Cloudflare Workers via
      # Hyperdrive) is unaffected and continues to use drizzle-kit migrate.
      - name: Reset test database
        run: |
          psql "${{ secrets.POSTGRES_DIRECT_URL }}" -v ON_ERROR_STOP=1 <<'SQL'
          DROP SCHEMA IF EXISTS drizzle CASCADE;
          DROP SCHEMA public CASCADE;
          CREATE SCHEMA public;
          CREATE SCHEMA drizzle;
          CREATE TABLE drizzle.__drizzle_migrations (
            id SERIAL PRIMARY KEY,
            hash TEXT NOT NULL,
            created_at BIGINT
          );
          SQL

      # Apply hand-written migrations in order via psql. See "Reset test
      # database" step above for the IPv4/IPv6 background on why we can't
      # use drizzle-kit migrate here. Prod still uses drizzle-kit migrate
      # (which tracks applied migrations in drizzle.__drizzle_migrations);
      # CI wipes and reapplies every run, so tracking is unnecessary.
      #
      # Order comes from _journal.json, not a filesystem glob, so CI applies
      # migrations in exactly the order drizzle-kit migrate uses in prod.
      # A glob diverges whenever two migrations share a numeric prefix
      # (0035_profile_owners vs 0035_social_statuses_recipients_gin already
      # do, from position 36 on), and it applies files with no journal entry
      # -- which prod silently skips. That gap shipped 0048 to production
      # with its tables never created. Reading the journal also means an
      # unjournaled migration is never applied here, so tests that depend
      # on it fail loudly instead of passing against a schema prod lacks.
      - name: Apply migrations
        run: |
          set -e
          python3 -c "import json; print('\n'.join(e['tag'] for e in sorted(json.load(open('drizzle/meta/_journal.json'))['entries'], key=lambda e: e['idx'])))" > /tmp/migration-order.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            f="drizzle/$tag.sql"
            if [ ! -f "$f" ]; then
              echo "ERROR: journal lists '$tag' but $f does not exist"
              exit 1
            fi
            echo "=== $f ==="
            psql "$POSTGRES_DIRECT_URL" -v ON_ERROR_STOP=1 -f "$f"
          done < /tmp/migration-order.txt
        env:
          POSTGRES_DIRECT_URL: ${{ secrets.POSTGRES_DIRECT_URL }}

      # Read-only probe, and temporary. The data-layer suite is moving to a
      # throwaway Postgres service container (.github/workflows/db-tests.yml);
      # this records what the shared project actually runs so that container can
      # be pinned to a measured version instead of a guessed one.
      #
      # The extension placement query matters beyond version-pinning. Migrations
      # 0041 and 0045 assert pg_trgm is in 'public' or 'extensions', and
      # directory search sets search_path to exactly those two. On a vanilla
      # container the extension always lands in public, so whichever branch this
      # project actually uses is the branch CI would stop exercising after the
      # cutover. Worth knowing before deciding that is acceptable.
      #
      # Runs after the migration replay on purpose: DROP SCHEMA public CASCADE
      # takes any extension installed in public with it, and the migrations then
      # recreate it, so this is the state the tests below actually see.
      - name: Record shared database characteristics
        run: |
          set -e
          probe() {
            psql "$POSTGRES_DIRECT_URL" -At -c "$1"
          }
          {
            echo '### Shared test database (read-only probe)'
            echo
            echo '```'
            echo "server_version:  $(probe 'SHOW server_version')"
            echo "max_connections: $(probe 'SHOW max_connections')"
            echo 'extensions:'
            probe "SELECT '  ' || e.extname || ' -> ' || n.nspname FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace ORDER BY 1"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          POSTGRES_DIRECT_URL: ${{ secrets.POSTGRES_DIRECT_URL }}

      # Data-layer tests (tests-db/) run here rather than in their own job so
      # they reuse the database the step above just migrated. They are fast,
      # need no browser, and failing now skips a Playwright install that was
      # going to fail anyway. Fixtures are namespaced per run and cleaned up,
      # so they do not disturb the Playwright specs that follow.
      #
      # test:db passes --test-concurrency=1. node --test runs one process per
      # file, and each process opens its own postgres.js pool, so the number of
      # connections scales with the number of test files while the pooler caps
      # us at 15 in session mode. That ceiling was crossed by simply adding a
      # tenth file: every test in it failed with EMAXCONNSESSION, which reads
      # like a schema or fixture fault and is neither. Running the files in
      # series keeps the connection count flat as the suite grows, and has the
      # side benefit of removing cross-file interference between fixtures that
      # share one database.
      - name: Run database tests
        run: yarn test:db
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}

      - name: Validate environment variables
        run: npm run env:check
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          NEXT_PUBLIC_HOST_URL: ${{ vars.NEXT_PUBLIC_HOST_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # wrangler dev reads .dev.vars and injects ALL entries as env bindings (env.KEY)
      # into the Worker. This is how POSTGRES_URL and auth secrets reach the workerd runtime.
      - name: Create .dev.vars for wrangler dev
        run: |
          echo "POSTGRES_URL=${{ secrets.POSTGRES_URL }}" >> .dev.vars
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .dev.vars
          echo "BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}" >> .dev.vars
          echo "ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}" >> .dev.vars
          echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .dev.vars
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .dev.vars
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .dev.vars
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .dev.vars
          echo "R2_BUCKET_NAME=${{ vars.R2_BUCKET_NAME }}" >> .dev.vars
          echo "R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}" >> .dev.vars
          # Empty on purpose: wrangler.jsonc sets this to ".pana.social" for
          # production, which browsers reject on the localhost host the test
          # server runs on. Empty restores host-only cookies so any future
          # session-dependent spec can actually hold a session.
          echo "PANAVERSE_COOKIE_DOMAIN=" >> .dev.vars

      # `yarn build` is now just `vinext build` (no migrate prefix), so this
      # is equivalent — kept explicit for clarity that CI does not migrate
      # during build (migrations were applied in the "Apply migrations" step).
      - name: Build app
        run: yarn build
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_DIRECT_URL: ${{ secrets.POSTGRES_DIRECT_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          NEXT_PUBLIC_HOST_URL: ${{ vars.NEXT_PUBLIC_HOST_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_ENABLED }}
          NEXT_PUBLIC_APPLE_ENABLED: ${{ vars.NEXT_PUBLIC_APPLE_ENABLED }}
          NEXT_PUBLIC_MASTODON_ENABLED: ${{ vars.NEXT_PUBLIC_MASTODON_ENABLED }}
          NEXT_PUBLIC_WIKIMEDIA_ENABLED: ${{ vars.NEXT_PUBLIC_WIKIMEDIA_ENABLED }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}

      - name: Run Playwright tests
        run: yarn test
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          NEXT_PUBLIC_HOST_URL: ${{ vars.NEXT_PUBLIC_HOST_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_ENABLED }}
          NEXT_PUBLIC_APPLE_ENABLED: ${{ vars.NEXT_PUBLIC_APPLE_ENABLED }}
          NEXT_PUBLIC_MASTODON_ENABLED: ${{ vars.NEXT_PUBLIC_MASTODON_ENABLED }}
          NEXT_PUBLIC_WIKIMEDIA_ENABLED: ${{ vars.NEXT_PUBLIC_WIKIMEDIA_ENABLED }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
