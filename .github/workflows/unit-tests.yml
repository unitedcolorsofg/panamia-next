name: Unit Tests

# Tests that need neither a database nor secrets. They run on every pull
# request, including ones from forks, which cannot read repository secrets and
# so can never run the Playwright job.
#
# Kept separate from playwright.yml deliberately. That workflow serialises on a
# single shared Supabase project (`concurrency: playwright-shared-db`), so a
# run can sit queued behind an unrelated one for a long time. The checks here
# take seconds, need no such lock, and should not wait on it -- a change that
# reopens a data-disclosure bug ought to go red immediately, not eventually.

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Runs Postgres compiled to WASM (PGlite) in-process, so there is no
      # service container, no connection string, and nothing shared between
      # runs. Covers status visibility (tests-db/visibility.test.ts) and the
      # session-telemetry purge migration, which is executed for real so that
      # SQL which does not parse fails here rather than on deploy.
      - name: Database behaviour (PGlite)
        run: yarn test:db

      # Builds JPEG, PNG and WebP fixtures carrying GPS, camera and XMP data,
      # then checks the stripper removes them without altering a pixel
      # (tests-unit/strip-metadata.test.ts). Also covers federation being
      # opt-in and auth sessions not retaining IP or user-agent.
      - name: Privacy unit tests
        run: yarn test:unit
